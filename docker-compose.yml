services:
  mongodb:
    image: mongo:9.0.8
    container_name: mongo-user-items-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: test
    volumes:
      - ./.docker/mongodb/data/db/:/data/db/

volumes:
  mongo_data:
